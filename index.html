<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacerdócio de Umbanda — Organizador</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap');
:root {

  --text:#e8e0d0;--text2:#a09080;--text3:#6a5a4a;
  --radius:8px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Jost','Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}
.container{max-width:860px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}
header{padding:60px 0 40px;text-align:center;}
.header-ornament{font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;opacity:0.8;}
header h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(36px,6vw,54px);font-weight:500;color:var(--gold2);line-height:1.15;margin-bottom:10px;}
header h1 em{font-style:italic;color:var(--text);}
.header-sub{font-size:13px;color:var(--text2);letter-spacing:0.05em;}
.coroa-badge{display:inline-flex;align-items:center;margin-top:20px;padding:8px 20px;border:0.5px solid var(--border2);border-radius:40px;background:var(--gold-dim);font-size:12px;color:var(--text2);letter-spacing:0.05em;}
.gold-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px auto;}
.nav{display:flex;gap:2px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:4px;margin-bottom:32px;flex-wrap:wrap;}
.nav-btn{flex:1;min-width:100px;padding:9px 12px;border:none;background:transparent;color:var(--text2);font-family:'Jost',Arial,sans-serif;font-size:12px;font-weight:400;letter-spacing:0.06em;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;transition:all 0.2s;text-align:center;}
.nav-btn:hover{color:var(--text);background:var(--bg3);}
.nav-btn.active{background:var(--gold-dim);color:var(--gold2);border:0.5px solid var(--border2);}
.section{display:none;}.section.active{display:block;animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:12px;}
.card-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:500;color:var(--gold2);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.card-title::before{content:'';display:inline-block;width:20px;height:1px;background:var(--gold);flex-shrink:0;}
.etapa{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;}
.etapa:hover{border-color:var(--border2);}.etapa.open{border-color:var(--gold);}
.etapa-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;}
.etapa-seq{font-size:10px;color:var(--text3);letter-spacing:0.1em;min-width:18px;text-align:center;font-weight:500;}
.etapa-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.etapa-info{flex:1;}
.etapa-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:500;color:var(--text);line-height:1.2;}
.etapa-meta{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:0.03em;}
.etapa-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;letter-spacing:0.05em;font-weight:500;}
.badge-campo{background:rgba(60,100,60,0.3);color:#80c080;border:0.5px solid rgba(60,120,60,0.4);}
.badge-terreiro{background:rgba(100,80,40,0.3);color:var(--gold);border:0.5px solid var(--border);}
.badge-ok{background:rgba(60,100,60,0.2);color:#80c080;}
.badge-warn{background:rgba(180,120,20,0.2);color:#c09040;}
.etapa-body{display:none;padding:0 20px 20px;border-top:0.5px solid var(--border);}
.etapa.open .etapa-body{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px;}
.di{background:var(--bg3);border-radius:var(--radius);padding:10px 12px;border:0.5px solid var(--border);}
.dl{font-size:9px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;}
.dv{font-size:13px;color:var(--text2);line-height:1.5;}
.detail-full{background:var(--bg3);border-radius:var(--radius);padding:10px 12px;border:0.5px solid var(--border);margin-top:8px;}
.connector{display:flex;align-items:stretch;padding:0 0 0 20px;}
.conn-line{width:1px;background:var(--border);margin-left:24px;margin-right:12px;flex-shrink:0;}
.conn-label{font-size:11px;color:var(--text3);padding:5px 0;align-self:center;letter-spacing:0.05em;}
.gcal-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--radius);border:0.5px solid rgba(66,133,244,0.4);background:rgba(66,133,244,0.1);color:#6aacf8;font-family:'Jost',Arial,sans-serif;font-size:11px;font-weight:500;cursor:pointer;letter-spacing:0.04em;text-decoration:none;transition:all 0.15s;}
.gcal-btn:hover{background:rgba(66,133,244,0.2);border-color:rgba(66,133,244,0.6);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav button{background:var(--bg3);border:0.5px solid var(--border);color:var(--text2);padding:6px 16px;border-radius:var(--radius);cursor:pointer;font-family:'Jost',Arial,sans-serif;font-size:12px;transition:all 0.15s;}
.cal-nav button:hover{border-color:var(--border2);color:var(--text);}
.cal-month-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:var(--gold2);font-weight:500;}
.cal-week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
.cal-wh{text-align:center;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:0.05em;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{background:var(--bg3);border:0.5px solid var(--border);border-radius:6px;padding:6px 3px;text-align:center;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.cal-day.empty{background:transparent;border-color:transparent;}
.cal-day.today{border-color:var(--gold);background:var(--gold-dim);}
.cal-day.lua-nova{background:rgba(20,15,10,0.8);border-color:rgba(100,80,40,0.4);}
.cal-day.lua-cheia{background:rgba(200,160,74,0.1);border-color:rgba(200,160,74,0.4);}
.cal-day .cdn{font-size:12px;font-weight:500;color:var(--text);}
.cal-day .cmi{font-size:16px;}
.cal-day .cms{font-size:9px;color:var(--text3);line-height:1.2;}
.cal-day.today .cdn{color:var(--gold);}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--text3);}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr;}header h1{font-size:32px;}.cal-day{min-height:50px;}}
footer{text-align:center;padding:40px 0 60px;font-size:11px;color:var(--text3);letter-spacing:0.08em;}
footer .gold-line{margin:0 auto 16px;}
</style>
</head>

</div>

function getMoon(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const key=y+'-'+m+'-'+d;
  if(FASES_2026[key])return FASES_2026[key];
  const ms=date.getTime();
  const entries=Object.entries(FASES_2026).map(([k,v])=>{const[ky,km,kd]=k.split('-').map(Number);return{t:new Date(ky,km-1,kd).getTime(),v};}).sort((a,b)=>a.t-b.t);
  let prev=entries[0],next=entries[entries.length-1];
  for(let i=0;i<entries.length-1;i++){if(entries[i].t<=ms&&entries[i+1].t>ms){prev=entries[i];next=entries[i+1];break;}}
  return((ms-prev.t)/(next.t-prev.t))<0.5?prev.v:next.v;
}
function moonOk(moon,pref){const q=moon.q;if(pref==='qualquer')return q!=='minguante';if(pref==='cheia')return q==='cheia'||q==='crescente';if(pref==='nova')return q==='nova'||q==='crescente';if(pref==='minguante')return q==='minguante';return true;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmt(d){return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});}
function fmtS(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}
function fmtLong(d){return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});}
function dl(d){return['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];}

function moonPrefLabel(p){
  if(p==='cheia')return'🌕 Lua cheia';
  if(p==='nova')return'🌑 Lua nova (menos minguante)';
  if(p==='minguante')return'🌘 Lua minguante';
  if(p==='crescente')return'🌒 Lua crescente';
  return'🌙 Qualquer menos minguante';
}

function coroaTag(c){
  if(c==='voce')return'';
  if(c==='coroa2')return'';
  if(c==='ajunto')return'';
  return'';
}

const TERREIRO='Servidão João Manoel Inácio - Vargem Grande, Florianópolis - SC, 88052-675';
function toGCalDate(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function gcalUrl(e){
  const title=encodeURIComponent('Sacerdócio — '+e.names.join(' & '));
  const start=toGCalDate(e.sat),end=toGCalDate(addDays(e.sat,1));
  const loc=encodeURIComponent(e.campo?e.local:TERREIRO);
  const det=encodeURIComponent('Obrigação: '+e.names.join(' e ')+'\nLocal: '+e.local+'\nLua: '+e.moon.icon+' '+e.moon.name+'\nPreceito: '+fmt(e.precStart)+'\nObrigação: '+fmt(e.sat));
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&dates='+start+'/'+end+'&details='+det+'&location='+loc;
}

function buildSchedule(){
  return ETAPAS_DEF.map((e,i)=>{
    const sat=FIXED_DATES[i];
    const moon=getMoon(sat);
    const isIfa=i===ETAPAS_DEF.length-1;
    let precStart;
    if(e.preceito===3){precStart=addDays(sat,-3);}
    else if(isIfa){precStart=new Date(2026,10,23);}
    else{precStart=addDays(sat,-6);}
    return{...e,sat,sun:addDays(sat,1),precStart,moon};
  });
}

let calYear=2026,calMonth=4;
function renderLunar(){
  const today=new Date();
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  document.getElementById('cal-month-title').textContent=MONTH_NAMES[calMonth]+' '+calYear;
  let html='';
  for(let i=0;i<first;i++)html+='<div class="cal-day empty"></div>';
  for(let d=1;d<=days;d++){
    const dt=new Date(calYear,calMonth,d);
    const m=getMoon(dt);
    const isToday=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    let cls=m.q==='nova'?'lua-nova':m.q==='cheia'?'lua-cheia':'';
    if(isToday)cls+=' today';
    html+=`<div class="cal-day ${cls}"><div class="cdn">${d}</div><div class="cmi">${m.icon}</div><div class="cms">${m.name.replace('Lua ','').replace('Quarto ','Q. ')}</div></div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
function changeMonth(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderLunar();}

function showSection(name,ev){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  if(ev&&ev.target)ev.target.classList.add('active');
}
